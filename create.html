<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Student</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Add Student</h1>
    <div class="nav-links"><a href="index.html">Back</a></div>
    <div id="errors"></div>

    <form id="studentForm">
      <div class="form-group">
        <label for="student_number">Student Number</label>
        <input type="text" id="student_number" maxlength="30" required>
      </div>
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" maxlength="100" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" maxlength="100" required>
      </div>
      <div class="form-group">
        <label for="course">Course</label>
        <input type="text" id="course" maxlength="100" required>
      </div>
      <div class="form-group">
        <label for="year_level">Year Level</label>
        <select id="year_level" required>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>
      <button type="submit">Save Student</button>
    </form>
  </div>

  <script src="storage.js"></script>
  <script>
    document.getElementById("studentForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const student_number = document.getElementById("student_number").value.trim();
      const full_name = document.getElementById("full_name").value.trim();
      const email = document.getElementById("email").value.trim();
      const course = document.getElementById("course").value.trim();
      const year_level = document.getElementById("year_level").value;
      const errors = [];

      if (!student_number || student_number.length > 30) errors.push("Student number is required (max 30 chars).");
      if (!full_name || full_name.length > 100) errors.push("Full name is required (max 100 chars).");
      if (!email || email.length > 100 || !isValidEmail(email)) errors.push("Please enter a valid email address.");
      if (!course || course.length > 100) errors.push("Course is required (max 100 chars).");
      if (!["1", "2", "3", "4"].includes(year_level)) errors.push("Year level must be 1 to 4.");

      if (errors.length) {
        document.getElementById("errors").innerHTML =
          '<div class="error-box"><ul>' + errors.map(err => `<li>${err}</li>`).join("") + "</ul></div>";
        return;
      }

      addRecord({ student_number, full_name, email, course, year_level: Number(year_level) });
      location.href = "index.html";
    });
  </script>
</body>
</html>
